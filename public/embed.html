<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Video</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
    #player { position:absolute; top:0; left:0; width:100%; height:100%; }
    * { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    var qs = new URLSearchParams(window.location.search);
    var videoId = qs.get('v');
    var autoplay = qs.get('autoplay') === '1' ? 1 : 0;

    var player;
    var ended = false;
    var apiReady = false;
    function post(type, data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, data: data || null }));
      }
    }

    if (!videoId) {
      post('unavailable', 'missing_video_id');
    } else {
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      tag.onerror = function () { post('unavailable', 'script_load_failed'); };
      document.body.appendChild(tag);

      setTimeout(function () {
        if (!apiReady) post('unavailable', 'timeout');
      }, 10000);

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: {
            autoplay: autoplay,
            playsinline: 1,
            modestbranding: 1,
            rel: 0,
            fs: 1,
            iv_load_policy: 3,
            controls: 1
          },
          events: {
            onReady: function () { apiReady = true; post('ready'); },
            onStateChange: function (e) {
              if (e.data === 0 && !ended) {
                ended = true;
                post('ended');
              }
              if (e.data === 1) post('playing');
            },
            onError: function (e) {
              post('error', e.data);
              if ([100, 101, 150].indexOf(e.data) !== -1) post('unavailable', e.data);
            }
          }
        });
      };
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a');
      if (a && a.href && a.href.indexOf('youtube.com/watch') === -1) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
